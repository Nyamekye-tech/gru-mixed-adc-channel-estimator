[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "chest"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
experiments = [
    "matplotlib>=3.7",
    "pandas>=2.0",
]
test = [
    "pytest>=8.0",
]
neural = [
    "torch>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
